; Torchbearer: QoL and stereo 3D for Alan Wake Remastered.
; Re-read live whenever this file changes. Quiver writes it from the Options page
; (quiver mods "Alan Wake Remastered" options ...), and sends changes live while the game runs.

[log]
verbose = 0

[intro]
; Read once at launch. Skips the boot sequence before the title screen.
; The Remedy logo video.
skip_startup_video = 1
; The Epic Games logo and the partner logos / rights notice.
skip_logo_screens = 1
; The photosensitivity warning screen.
skip_epilepsy_warning = 1

; The game's own settings (docs/settings.md), applied live through the game's own code and saved
; to its files. A key left out (or empty) keeps the game's own value; a change made in the game's
; menu is reported back to Quiver. Examples:
;   brightness = 60          ; 0..100
;   quality = custom         ; low | medium | high | custom
;   resolution = 2560x1440
;   dlss = quality           ; off | ultra_performance | performance | balanced | quality | dlaa
[game]

; Key bindings, as Quiver names keys: KeyW, Digit1, Space, Shift, Ctrl, F5, Mouse1..Mouse5.
;   jump = Space
[keys]

[dev]
; Testing aids (docs/levels.md). All off by default.
; Boot straight into a level once the main menu is up: 01..05, 09..17, 100 (dlc1), 200 (dlc2),
; continue (the checkpoint save, e.g. a fixture), or a world:level name. Empty = off.
start_level =
; easy | normal | nightmare (for start_level).
start_difficulty = easy
; 1 = show the game's hidden Developer Menu in the main and pause menus (unlock all episodes,
; weapons, flashlight).
developer_menu = 0
; 1 = skip Bink cutscene videos as soon as they start (as if the player skipped them).
skip_videos = 0

[stereo]
; Stereoscopic 3D (docs/stereo.md). Default off.
;   off        pass-through
;   left/right one eye on every frame (mono-frame bias, for measurement)
;   alternate  eyes alternate per frame (frame-sequential)
;   sbs        both eyes rendered from the same game update, composed side by side
mode = off
; per-eye lateral offset in millimetres (65 mm interocular = 32.5 per eye)
separation = 32.5
; distance of the screen plane in metres: nearer things come out of the screen, farther ones sit
; behind it. 0 = parallel eyes (distant things at the screen, everything else in front of it,
; including in front of the HUD). 3-5 m suits the third-person camera.
convergence = 4
swap_eyes = 0
; sbs output (read at startup):
;   full = window and swapchain twice the game's width, each eye 1:1 (3840x1080 for 1920x1080 per
;          eye; for glasses driven as a raw 3840x1080 desktop: borderless gives 1920 per eye)
;   hsbs = half side-by-side for compositors that split a window per eye (HypXRland's 3D mode,
;          a 1920x1080 desktop): the window keeps the desktop size and each eye is rendered at half
;          the width with the full 16:9 view squeezed 2:1 (borderless: 960x1080 per eye)
;   sbs  = full side-by-side under HypXRland: the window keeps the desktop size, each eye is a full
;          1920x1080 image; needs a Proton whose Wayland driver accepts a swapchain larger than the
;          window (GE-Proton11-12-hypxr with PROTON_ENABLE_WAYLAND=1 and
;          WINE_VULKAN_ALLOW_LARGER_SWAPCHAIN=1; docs/stereo-output.md)
;   none = normal window; 3D mode then renders a normal (mono) image ("half" is accepted too)
output = none
; full / hsbs only: tag the game's window `stereo-sbs` / `stereo-hsbs` over the Hyprland IPC socket
; so a HypXRland rule (`stereo <layout> always, match tag stereo-<layout>`) presents it per eye.
; Inert when not running under Hyprland.
hyprland_tag = 1
; sbs/alternate keep the game's TAA as set in its options, with a separate TAA history per eye
; (1, default); 0 = switch TAA off while sbs runs. Without per-eye state (game patched) TAA is
; switched off in sbs regardless.
taa = 1
; same for object motion vectors (motion blur / TAA reprojection of moving objects): 1 = kept,
; each eye with its own previous camera matrices; 0 = off while sbs runs
object_velocity = 1
; sbs with the game's DLSS on: 1 = a DLSS feature (temporal history) per eye; 0 = one feature
; reset every frame (no cross-eye blending, but no accumulation: softer). Falls back to 0 by itself
; if the second feature cannot be created.
dlss_per_eye = 1
; measurement lever: synthetic camera yaw in degrees per game update (0 = off)
test_pan = 0
; sbs rendering: view = both eyes inside one engine frame (renderFrame twice; HUD, frame-level work
; and Present once per update), frame = the whole engine frame twice (first Present swallowed)
sbs_path = view
; view path, second eye: reuse the first eye's shadow maps / sky cube probe instead of rendering
; them again (eye-independent work, about 10 % faster; docs/stereo.md section 6).
; skip_shadows is experimental and off: the second eye then loses the flashlight's lit spot.
skip_shadows = 0
skip_probe = 1
; view path: lens flares see the same visibility history in both eyes (1 = on)
flare_rewind = 1
; view path: the second eye replays the first eye's rand() draws (tonemap noise, volumetric jitter,
; ...), so both eyes of an update use the same random numbers (1 = on)
rand_replay = 1
; sbs/alternate: SSAO, volumetric-light and Taken shade-effect temporal buffers kept per eye (1 = on)
temporal_per_eye = 1

[camera]
; First-person camera (docs/first-person.md), live. Prototype.
;   third_person  the game's own camera (default; the feature is inert)
;   first_person  during normal gameplay (player camera, on foot) the rendered camera sits at the
;                 player's eyes, looking where the game camera looks; cutscenes, cinematic, death
;                 and vehicle cameras stay the game's own
mode = third_person
; head = follow the head (animated: bobs with the walk), body = the character's root plus eye_height
anchor = head
; eye offset from the head (metres): up, and ahead along the view
eye_up = 0.05
eye_forward = 0.10
; anchor = body: eye height above the character's feet (metres)
eye_height = 1.70
; seconds: smooths the head's motion relative to the body (0 = raw; the head drops up to 25 cm
; when a walk starts, measured)
smooth = 0.1
; all = hide the player's body and the flashlight / gun meshes (the flashlight's beam stays on),
; body = hide the body but keep the held flashlight and gun visible, none = hide nothing
hide = all
; horizontal field of view in degrees at 16:9 in first person (0 = the game's own, game.fov)
fov = 0
; metres: > 0 turns the view to look at the point this far along the game camera's ray (where the
; reticle points at that range), 0 = the game camera's direction unchanged. The game aims along
; its own (third-person) camera's centre ray, so the screen centre only matches the aim point at
; this range.
aim_distance = 15
