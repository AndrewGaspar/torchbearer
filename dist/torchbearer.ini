; Torchbearer: QoL and stereo 3D for Alan Wake Remastered.
; Re-read live whenever this file changes. Quiver writes it from the Options page
; (quiver mods "Alan Wake Remastered" options ...), and sends changes live while the game runs.

[log]
verbose = 0

[intro]
; Read once at launch. Skips the boot sequence before the title screen.
; The Remedy logo video.
skip_startup_video = 1
; The Epic Games logo and the partner logos / rights notice.
skip_logo_screens = 1
; The photosensitivity warning screen.
skip_epilepsy_warning = 1
