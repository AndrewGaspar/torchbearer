; Torchbearer: QoL and stereo 3D for Alan Wake Remastered.
; Re-read live whenever this file changes. Quiver writes it from the Options page
; (quiver mods "Alan Wake Remastered" options ...), and sends changes live while the game runs.

[log]
verbose = 0

[intro]
; Read once at launch. Skips the boot sequence before the title screen.
; The Remedy logo video.
skip_startup_video = 1
; The Epic Games logo and the partner logos / rights notice.
skip_logo_screens = 1
; The photosensitivity warning screen.
skip_epilepsy_warning = 1

; The game's own settings (docs/settings.md), applied live through the game's own code and saved
; to its files. A key left out (or empty) keeps the game's own value; a change made in the game's
; menu is reported back to Quiver. Examples:
;   brightness = 60          ; 0..100
;   quality = custom         ; low | medium | high | custom
;   resolution = 2560x1440
;   dlss = quality           ; off | ultra_performance | performance | balanced | quality | dlaa
[game]

; Key bindings, as Quiver names keys: KeyW, Digit1, Space, Shift, Ctrl, F5, Mouse1..Mouse5.
;   jump = Space
[keys]

[dev]
; Testing aids (docs/levels.md). All off by default.
; Boot straight into a level once the main menu is up: 01..05, 09..17, 100 (dlc1), 200 (dlc2),
; continue (the checkpoint save, e.g. a fixture), or a world:level name. Empty = off.
start_level =
; easy | normal | nightmare (for start_level).
start_difficulty = easy
; 1 = show the game's hidden Developer Menu in the main and pause menus (unlock all episodes,
; weapons, flashlight).
developer_menu = 0
; 1 = skip Bink cutscene videos as soon as they start (as if the player skipped them).
skip_videos = 0

[stereo]
; Stereoscopic 3D (docs/stereo.md). Default off.
;   off        pass-through
;   left/right one eye on every frame (mono-frame bias, for measurement)
;   alternate  eyes alternate per frame (frame-sequential)
;   sbs        both eyes rendered from the same game update, composed side by side
mode = off
; per-eye lateral offset in millimetres (65 mm interocular = 32.5 per eye)
separation = 32.5
; distance of the screen plane in metres; 0 = parallel eyes (everything behind the screen)
convergence = 0
swap_eyes = 0
; sbs output: full = 3840x1080 swapchain (each eye 1920x1080, 1:1; read at startup),
; half = same-size swapchain (prototype: centre crop of each eye)
output = half
; keep the game's TAA in sbs mode (1 blends across eyes; default 0 = TAA off while sbs runs)
taa = 0
; keep object motion vectors in sbs mode (1 smears moving objects across eyes; default 0)
object_velocity = 0
; measurement lever: synthetic camera yaw in degrees per game update (0 = off)
test_pan = 0
; sbs rendering: view = both eyes inside one engine frame (renderFrame twice; HUD, frame-level work
; and Present once per update), frame = the whole engine frame twice (first Present swallowed)
sbs_path = view
; view path, second eye: reuse the first eye's shadow maps / sky cube probe instead of rendering
; them again (eye-independent work; docs/stereo.md section 4)
skip_shadows = 0
skip_probe = 0
; view path: lens flares see the same visibility history in both eyes (1 = on)
flare_rewind = 1
