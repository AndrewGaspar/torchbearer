format = 1
surface = "torchbearer"
title = "Torchbearer"
help = "Alan Wake Remastered: the game's own settings, live, and stereoscopic 3D."
audited = "2026-11-18: game.* and keys.* written with src/features/settings.cpp; every id, range and apply mode checked in the lab (docs/settings.md)."

[match]
files = ["torchbearer.ini"]

# The mod re-reads torchbearer.ini every 250 ms and also takes values live over the mod SDK.
# The game's settings (ids game.* and keys.*) are applied through the game's own code on its main
# thread (docs/settings.md). A setting with no value leaves the game's own value alone; a change
# made in the game's own menu is reported back and saved to the profile.
[file.ini]
path = "torchbearer.ini"
format = "ini"
owner = "quiver"
reload = "poll"

# ---------------------------------------------------------------- pages

[[page]]
id = "display"
title = "Display"
options = ["game.resolution", "game.display_mode", "game.vsync", "game.dlss",
           "game.resolution_scale", "game.hdr", "game.monitor"]

[[page]]
id = "picture"
title = "Picture"
options = ["game.brightness", "game.fov", "game.motion_blur", "game.film_grain", "game.hud",
           "game.hud_size"]

[[page]]
id = "quality"
title = "Graphics quality"
options = ["game.quality", "game.taa", "game.fxaa", "game.msaa", "game.anisotropy",
           "game.shadows", "game.volumetrics", "game.terrain", "game.draw_distance"]

[[page]]
id = "audio"
title = "Audio and subtitles"
options = ["game.music", "game.effects", "game.speech", "game.cinematic", "game.english_speech",
           "game.subtitles", "game.subtitle_size", "game.subtitle_background", "game.commentary"]

[[page]]
id = "controls"
title = "Controls"
options = ["game.invert_y", "game.invert_x", "game.mouse_sensitivity_x",
           "game.mouse_sensitivity_y", "game.direct_aiming", "game.modern_camera"]

[[page.group]]
title = "Gamepad"
options = ["game.gamepad_sensitivity", "game.vibration", "game.gamepad_layout",
           "game.driving_layout", "game.swap_sticks", "game.swap_triggers"]

[[page]]
id = "keys"
title = "Key bindings"
options = ["keys.move_forward", "keys.move_backward", "keys.move_left", "keys.move_right",
           "keys.turboboost", "keys.walk", "keys.jump", "keys.use", "keys.reload",
           "keys.shoot", "keys.light_boost", "keys.throw_item", "keys.reload_battery",
           "keys.look_at", "keys.toggle_manuscript", "keys.inventory_right", "keys.inventory_up",
           "keys.inventory_left", "keys.inventory_down", "keys.inventory_extra",
           "keys.toggle_side"]

[[page]]
id = "startup"
title = "Startup"
options = ["intro.skip_startup_video", "intro.skip_logo_screens", "intro.skip_epilepsy_warning"]

[[page]]
id = "stereo"
title = "Stereoscopic 3D"
options = ["stereo.mode", "stereo.output", "stereo.separation", "stereo.convergence", "stereo.swap_eyes"]

[[page.group]]
title = "Temporal effects in 3D"
options = ["stereo.taa", "stereo.object_velocity"]

[[page]]
id = "diagnostics"
title = "Diagnostics"
options = ["log.verbose"]

# ---------------------------------------------------------------- display

[option."game.resolution"]
type = "string"
label = "Resolution"
help = "Width x height, e.g. 1920x1080. Ignored in borderless mode, which uses the display's own resolution."
pattern = '^[0-9]{3,5}x[0-9]{3,5}$'
apply = "live"

[option."game.display_mode"]
type = "enum"
label = "Window mode"
values = [
  { value = "fullscreen", label = "Fullscreen" },
  { value = "windowed", label = "Windowed" },
  { value = "borderless", label = "Borderless" },
]
apply = "live"

[option."game.vsync"]
type = "bool"
label = "VSync"
default = "0"
apply = "live"

[option."game.dlss"]
type = "enum"
label = "NVIDIA DLSS"
help = "Replaces the game's anti-aliasing while on (TAA and MSAA are switched off, as the game's menu does)."
values = [
  { value = "off", label = "Off" },
  { value = "ultra_performance", label = "Ultra Performance" },
  { value = "performance", label = "Performance" },
  { value = "balanced", label = "Balanced" },
  { value = "quality", label = "Quality" },
  { value = "dlaa", label = "DLAA" },
]
default = "off"
apply = "live"

[option."game.resolution_scale"]
type = "int"
label = "Resolution scale"
help = "Render resolution with TAA; the game ignores it while DLSS is on."
min = 50
max = 100
step = 10
unit = "%"
default = 100
when = { "game.dlss" = "off" }
apply = "live"

[option."game.hdr"]
type = "bool"
label = "HDR"
help = "Only on an HDR display (the game greys it out otherwise)."
default = "0"
level = "advanced"
apply = "live"

[option."game.monitor"]
type = "int"
label = "Monitor"
help = "Which display the game uses (0 = the first)."
min = 0
max = 7
default = 0
level = "advanced"
apply = "live"

# ---------------------------------------------------------------- picture

[option."game.brightness"]
type = "int"
label = "Brightness"
min = 0
max = 100
step = 5
unit = "%"
default = 50
apply = "live"

[option."game.fov"]
type = "int"
label = "Field of view"
help = "Relative to the game's default field of view (the menu's slider spans 75 to 125 %)."
min = 75
max = 125
step = 5
unit = "%"
default = 100
apply = "live"

[option."game.motion_blur"]
type = "bool"
label = "Motion blur"
default = "1"
apply = "live"

[option."game.film_grain"]
type = "bool"
label = "Film grain"
default = "1"
apply = "live"

[option."game.hud"]
type = "bool"
label = "HUD"
default = "1"
apply = "live"

[option."game.hud_size"]
type = "int"
label = "HUD size"
help = "Scales the HUD by up to 2x. The game's own menu resets this to 50 % whenever any option is changed there."
min = 0
max = 100
step = 5
unit = "%"
default = 0
apply = "live"

