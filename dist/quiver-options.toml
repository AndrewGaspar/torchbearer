# ---------------------------------------------------------------- stereo (docs/stereo.md)

[option."stereo.mode"]
type = "enum"
label = "3D mode"
help = "Side-by-side renders the scene twice per game update, once per eye, at about half the frame rate. For XReal glasses in 3D mode, also set Output to Full and Window mode to Borderless."
values = [
  { value = "auto", label = "Auto: on stereo displays (HypXRland 3D mode)" },
  { value = "off", label = "Off" },
  { value = "sbs", label = "Side-by-side (both eyes per frame)" },
  { value = "alternate", label = "Alternate eyes per frame (frame-sequential)", level = "debug" },
  { value = "left", label = "Left eye only", level = "debug" },
  { value = "right", label = "Right eye only", level = "debug" },
]
default = "auto"
apply = "live"

[option."stereo.output"]
type = "enum"
label = "Output"
help = "How the two eyes reach the display. For XReal glasses under HypXRland pick Half side-by-side; Full side-by-side is for glasses driven as a plain 3840x1080 desktop. None renders a normal image even with 3D mode on."
values = [
  { value = "auto", label = "Auto: full or half side-by-side on stereo displays, else none" },
  { value = "hsbs", label = "Half side-by-side (HypXRland 3D mode)" },
  { value = "sbs", label = "Full side-by-side (HypXRland 3D mode, needs GE-Proton11-12-hypxr)" },
  { value = "full", label = "Full side-by-side (3840-wide window)" },
  { value = "none", label = "None: normal window (no 3D)" },
]
default = "auto"
apply = "restart"

[option."stereo.hyprland_tag"]
type = "bool"
label = "Declare stereo to Hyprland"
help = "With Full or Half side-by-side output, tag the game window stereo-sbs or stereo-hsbs over Hyprland's IPC socket so HypXRland shows each half to one eye (needs the matching window rule)."
default = true
level = "advanced"
apply = "restart"

[option."stereo.separation"]
type = "float"
label = "Eye separation"
help = "Offset of each eye from the game camera, in millimetres (32.5 = a 65 mm interocular distance at the game's scale). Larger is deeper."
min = 0
max = 100
step = 0.5
unit = "mm"
default = 32.5
apply = "live"

[option."stereo.convergence"]
type = "float"
label = "Screen distance"
help = "Distance of the screen plane in metres: nearer things come out of the screen, farther ones sit behind it. Parallel puts distant things at the screen and everything else in front of it, HUD included."
min = 0
max = 50
step = 0.5
unit = "m"
special = [{ value = 0, label = "Parallel" }]
default = 4
apply = "live"

[option."stereo.swap_eyes"]
type = "bool"
label = "Swap eyes"
help = "Cross-eyed viewing, or a display that expects the right eye on the left."
default = false
apply = "live"

[option."stereo.taa"]
type = "bool"
label = "Keep TAA in 3D"
help = "On: the game's TAA stays as set in its options, with a separate history per eye. Off: TAA is switched off while side-by-side runs."
default = true
level = "advanced"
apply = "live"

[option."stereo.dlss_per_eye"]
type = "bool"
label = "Separate DLSS per eye in 3D"
help = "On: each eye has its own DLSS history (sharp). Off: DLSS restarts its history every frame in 3D (no blending between eyes, but softer)."
default = true
level = "advanced"
apply = "live"

[option."stereo.object_velocity"]
type = "bool"
label = "Keep object motion vectors in 3D"
help = "On: motion blur and TAA reprojection of moving objects stay, with per-eye previous transforms. Off: switched off while side-by-side runs."
default = true
level = "advanced"
apply = "live"

[option."intro.skip_startup_video"]
type = "bool"
label = "Skip the Remedy logo video"
help = "Boots without the 5-second Remedy video."
default = true
level = "basic"
apply = "restart"

[option."intro.skip_logo_screens"]
type = "bool"
label = "Skip the logo screens"
help = "Boots without the Epic Games logo and the partner logos / rights notice (3 seconds each)."
default = true
level = "basic"
apply = "restart"

[option."intro.skip_epilepsy_warning"]
type = "bool"
label = "Skip the photosensitivity warning"
help = "Boots without the 6-second epilepsy warning screen."
default = true
level = "basic"
apply = "restart"

[option."stereo.sbs_path"]
type = "enum"
label = "Eye rendering"
help = "One frame: both eyes are rendered inside one engine frame (HUD, frame bookkeeping and Present once per game update; the HUD is copied into both halves). Two frames: the whole engine frame runs twice per update (the older path, kept as a fallback)."
values = [
  { value = "view", label = "Both eyes in one frame" },
  { value = "frame", label = "Two frames per update (fallback)" },
]
default = "view"
level = "advanced"
apply = "live"

[option."stereo.skip_shadows"]
type = "bool"
label = "Share shadow maps between eyes"
help = "Experimental: the second eye reuses the first eye's shadow maps (about 10 % faster), but loses the flashlight's lit spot. One-frame eye rendering only."
default = false
level = "advanced"
apply = "live"

[option."stereo.skip_probe"]
type = "bool"
label = "Share the sky probe between eyes"
help = "The second eye reuses the sky cube and ambient lighting the first eye computed in the same update. One-frame eye rendering only."
default = true
level = "advanced"
apply = "live"

# ---------------------------------------------------------------- graphics (docs/raytracing.md)

[option."graphics.ao"]
type = "enum"
label = "Ambient occlusion"
help = "The remaster's HBAO (the game's own), the original 2010 SSAO the remaster ships but never enables (stronger, reaches distant scenery, slight halos), or experimental ray-traced AO: contact shading from the actual scene geometry (needs a GPU with ray tracing; costs about 3-4 ms per frame at 1080p; foliage is approximated). Switching to or from ray-traced AO takes effect at the next launch."
values = [
  { value = "game", label = "HBAO (the game's)" },
  { value = "ssao", label = "Original SSAO (2010)" },
  { value = "rtao", label = "Ray-traced (experimental)" },
]
default = "game"
apply = "restart"

# ---------------------------------------------------------------- camera (docs/first-person.md)

[option."camera.mode"]
type = "enum"
label = "Camera"
help = "Prototype: first person puts the camera at Alan's eyes during normal gameplay (on foot, player camera) and hides his head (see Hide in first person), and works with 3D mode. Cutscene, cinematic, free, death and driving cameras stay the game's own."
values = [
  { value = "third_person", label = "Third person (the game's camera)" },
  { value = "first_person", label = "First person" },
]
default = "third_person"
level = "basic"
apply = "live"

[option."camera.framing"]
type = "enum"
label = "First-person framing"
help = "Close: Resident Evil style, the arms are posed so the flashlight (lower left) and the gun (lower right) are always in frame, the beam goes to the screen centre and the gun comes up to it when aiming. Classic: the arms as the third-person animation holds them (they show when aiming or looking down)."
values = [
  { value = "close", label = "Close (hands always in view)" },
  { value = "classic", label = "Classic (third-person arms)" },
]
default = "close"
level = "basic"
apply = "live"

[option."camera.hands_forward"]
type = "float"
label = "Hands: distance"
help = "Close framing: how far ahead of the eye the resting wrists are."
min = 0.2
max = 0.6
step = 0.01
unit = "m"
default = 0.34
level = "advanced"
apply = "live"

[option."camera.hands_drop"]
type = "float"
label = "Hands: height"
help = "Close framing: how far below the screen centre the resting wrists are, as a fraction of the frame's half-height (1 = the bottom edge)."
