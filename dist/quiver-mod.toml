id = "torchbearer"
name = "Torchbearer"
version = "0.4.1"
kind = "mod"
description = "QoL improvements and stereoscopic 3D for Alan Wake Remastered: every game setting live from Quiver's options, and true dual-eye side-by-side stereo for 3D glasses."
save_compatible = true
games = ["epic:7315f614b0504081bcdceef138075c9c"]

# The mod is a dxgi.dll proxy in the game folder (it forwards to the system dxgi).
# winewayland.drv disabled: the game runs on Wine's X11 driver (XWayland). Under Wine's Wayland
# driver the game's image is in a Wine subsurface, which HypXRland's per-eye stereo crop does not
# reach, and every lab test of the mod ran on X11 (docs/stereo-output.md). Cost: no Wine-Wayland HDR.
[launch]
dll = { dxgi = "n,b", "winewayland.drv" = "d" }
