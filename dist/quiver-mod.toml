id = "torchbearer"
name = "Torchbearer"
version = "0.5.1"
kind = "mod"
description = "QoL improvements and stereoscopic 3D for Alan Wake Remastered: every game setting live from Quiver's options, and true dual-eye side-by-side stereo for 3D glasses."
save_compatible = true
games = ["epic:7315f614b0504081bcdceef138075c9c"]

# The mod is a dxgi.dll proxy in the game folder (it forwards to the system dxgi).
# No display-driver override: forcing Wine's X11 driver (winewayland.drv=d, 0.4-0.4.1) made the
# game hang before its first frame on a desktop whose XWayland socket was unreachable (2026-11-19;
# docs/stereo-output.md). HypXRland's per-eye crop of Wine-Wayland games is being added instead.
[launch]
dll = { dxgi = "n,b" }
